# single plane -> plane_measurements is fine (the "last plane only" bug needs 2+ planes)
# plane_measurements:
#   - muro_1:
#       tags: [0, 1, 2, 3, 5, 6]
#       distance: 0.0
#       direction: [0, 0, 1]
#       noise: 0.001

body_defaults:
  position_noise: 0.05
  rotation_noise: 0.01

default_body: lab
bodies:
  - lab:
      is_static: true
      default_tag_size: 0.165
      pose:
        position: {x: 0.0, y: 0.0, z: 0.0}
        rotation: {x: 0.0, y: 0.0, z: 0.0}
        position_noise: {x: 0.0001, y: 0.0001, z: 0.0001}
        rotation_noise: {x: 0.00001, y: 0.00001, z: 0.00001}
      type: simple
      tags:
        - id: 0
          size: 0.165
          pose:
            position: {x: 0.0, y: 0.0, z: 0.0}
            rotation: {x: 0.0, y: 0.0, z: 0.0}
            position_noise: {x: 0.001, y: 0.001, z: 0.001}
            rotation_noise: {x: 0.001, y: 0.001, z: 0.001}
  - rig:
      is_static: false
      type: simple
      odom_frame_id: body_rig
      publish_covariance: true
      # Zero-motion prior between consecutive frames (30 Hz). In the batch
      # solution it only penalizes frame-to-frame acceleration, so it removes
      # the zigzag without lagging the motion (poses move < 2 mm at p95).
      # Typical motion here is 7-15 mm and ~0.4 deg per frame.
      fake_odom_translation_noise: 0.015
      fake_odom_rotation_noise: 0.03
