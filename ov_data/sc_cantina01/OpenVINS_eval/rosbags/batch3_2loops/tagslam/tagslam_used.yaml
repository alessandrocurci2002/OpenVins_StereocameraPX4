tagslam_parameters:
  # Use iSAM2 with graph-error checks. With corrected geometry this avoids
  # the cost of a full optimization after every frame.
  optimizer_mode: fast
  # Was 35: it dropped every tag seen at 25-35 deg. A NEW tag seen only that
  # obliquely never gets initialized, and every later frame that sees it fails
  # "could not initialize subgraph" -> 0.3-1.3 s holes in the trajectory.
  # Flip-prone oblique views are still rejected by the ambiguity check
  # (ambiguity_angle_threshold 60 deg / max_ambiguity_ratio 0.3, defaults).
  minimum_viewing_angle: 15.0
  minimum_tag_area: 100
  max_num_incremental_opt: 100
  pixel_noise: 1.0
  max_subgraph_error: 50.0
  subgraph_abs_prior_position_noise: 0.1
  subgraph_abs_prior_rotation_noise: 0.1
  use_approximate_sync: true

# All detections in this bag have hamming distance zero.
max_hamming_distance: 0
amnesia: false

# Planes, world frame = tag 0 frame (x right, y up, z out of muro_1 into the room).
# Written as coordinate_measurements on all 4 corners of each tag because
# plane_measurements in this TagSLAM build keeps only the LAST plane
# (src/measurements/plane.cpp assigns factors_ instead of appending).
#   muro_1   : z = 0      (tag 4 is NOT on this wall: it sits on a box at the far end)
#   muro_2   : x = -3.75  (estimated from the bag -> replace with tape measurement)
#   pavimento: y = -1.22  (estimated from the bag: height of tag 0 centre above floor)
coordinate_measurements:
